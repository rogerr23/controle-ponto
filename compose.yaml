services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-ponto-postgres
    environment:
      POSTGRES_DB: bd_controle_ponto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: roger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_controle_ponto"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
